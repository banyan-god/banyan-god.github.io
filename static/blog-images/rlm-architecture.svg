<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" font-family="'Courier New', monospace" font-size="12">
  <defs>
    <marker id="ad" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5" fill="#666"/>
    </marker>
    <marker id="au" markerWidth="7" markerHeight="5" refX="0" refY="2.5" orient="auto">
      <path d="M7,0 L0,2.5 L7,5" fill="#4a9eff"/>
    </marker>
  </defs>

  <rect width="900" height="680" fill="#0d1117"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" fill="#c9d1d9" font-size="15" font-weight="bold">RLM — Information Flow</text>

  <!-- Depth ruler -->
  <line x1="45" y1="50" x2="45" y2="620" stroke="#21262d" stroke-width="1"/>
  <text x="40" y="105" text-anchor="end" fill="#484f58" font-size="10">d=0</text>
  <text x="40" y="275" text-anchor="end" fill="#484f58" font-size="10">d=1</text>
  <text x="40" y="485" text-anchor="end" fill="#484f58" font-size="10">d=2</text>
  <circle cx="45" cy="100" r="3" fill="#484f58"/>
  <circle cx="45" cy="270" r="3" fill="#484f58"/>
  <circle cx="45" cy="480" r="3" fill="#484f58"/>

  <!-- ═══ ROOT (d=0) ═══ -->
  <rect x="280" y="55" width="340" height="95" rx="6" fill="#161b22" stroke="#4a9eff" stroke-width="2"/>
  <text x="450" y="78" text-anchor="middle" fill="#4a9eff" font-size="14" font-weight="bold">ROOT — orchestrator</text>
  <text x="300" y="98" fill="#7d8590" font-size="11">context: task + 5 summaries = ~3K tokens</text>
  <text x="300" y="115" fill="#7d8590" font-size="11">job: decompose → delegate → synthesize</text>
  <text x="300" y="132" fill="#3fb950" font-size="11">output: 222-line research report</text>

  <!-- ═══ DEPTH 1 — specialists ═══ -->

  <!-- Agent A: Financials -->
  <rect x="60" y="220" width="150" height="105" rx="5" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="135" y="240" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">FINANCIALS</text>
  <line x1="70" y1="248" x2="200" y2="248" stroke="#21262d"/>
  <text x="75" y="264" fill="#7d8590" font-size="9">reads earnings PDF</text>
  <text x="75" y="278" fill="#7d8590" font-size="9">searches 8 sources</text>
  <text x="75" y="292" fill="#7d8590" font-size="9">context used: ~28K</text>
  <text x="75" y="310" fill="#f0883e" font-size="9">returns: ~400 tokens</text>

  <!-- Agent B: Moat -->
  <rect x="225" y="220" width="150" height="105" rx="5" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="300" y="240" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">MOAT</text>
  <line x1="235" y1="248" x2="365" y2="248" stroke="#21262d"/>
  <text x="240" y="264" fill="#7d8590" font-size="9">analyzes EUV monopoly</text>
  <text x="240" y="278" fill="#7d8590" font-size="9">delegates 2 workers ↓</text>
  <text x="240" y="292" fill="#7d8590" font-size="9">context used: ~18K</text>
  <text x="240" y="310" fill="#f0883e" font-size="9">returns: ~600 tokens</text>

  <!-- Agent C: Geopolitics -->
  <rect x="390" y="220" width="150" height="105" rx="5" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="465" y="240" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">GEOPOLITICS</text>
  <line x1="400" y1="248" x2="530" y2="248" stroke="#21262d"/>
  <text x="405" y="264" fill="#7d8590" font-size="9">China curbs, chip war</text>
  <text x="405" y="278" fill="#7d8590" font-size="9">searches 12 sources</text>
  <text x="405" y="292" fill="#7d8590" font-size="9">context used: ~31K</text>
  <text x="405" y="310" fill="#f0883e" font-size="9">returns: ~500 tokens</text>

  <!-- Agent D: Valuation -->
  <rect x="555" y="220" width="150" height="105" rx="5" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="630" y="240" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">VALUATION</text>
  <line x1="565" y1="248" x2="695" y2="248" stroke="#21262d"/>
  <text x="570" y="264" fill="#7d8590" font-size="9">P/E, EV/EBITDA, PEG</text>
  <text x="570" y="278" fill="#7d8590" font-size="9">pulls historical data</text>
  <text x="570" y="292" fill="#7d8590" font-size="9">context used: ~22K</text>
  <text x="570" y="310" fill="#f0883e" font-size="9">returns: ~400 tokens</text>

  <!-- Agent E: Sentiment -->
  <rect x="720" y="220" width="150" height="105" rx="5" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="795" y="240" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">SENTIMENT</text>
  <line x1="730" y1="248" x2="860" y2="248" stroke="#21262d"/>
  <text x="735" y="264" fill="#7d8590" font-size="9">analyst ratings</text>
  <text x="735" y="278" fill="#7d8590" font-size="9">insider trades</text>
  <text x="735" y="292" fill="#7d8590" font-size="9">context used: ~19K</text>
  <text x="735" y="310" fill="#f0883e" font-size="9">returns: ~350 tokens</text>

  <!-- ═══ DEPTH 2 — workers (under MOAT) ═══ -->

  <rect x="170" y="440" width="140" height="85" rx="5" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/>
  <text x="240" y="460" text-anchor="middle" fill="#f0883e" font-size="11" font-weight="bold">WORKER B1</text>
  <line x1="180" y1="467" x2="300" y2="467" stroke="#21262d"/>
  <text x="185" y="482" fill="#7d8590" font-size="9">High-NA tech roadmap</text>
  <text x="185" y="496" fill="#7d8590" font-size="9">$370M/unit pricing</text>
  <text x="185" y="510" fill="#f0883e" font-size="9">returns: ~250 tokens</text>

  <rect x="330" y="440" width="140" height="85" rx="5" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/>
  <text x="400" y="460" text-anchor="middle" fill="#f0883e" font-size="11" font-weight="bold">WORKER B2</text>
  <line x1="340" y1="467" x2="460" y2="467" stroke="#21262d"/>
  <text x="345" y="482" fill="#7d8590" font-size="9">EUV supply chain</text>
  <text x="345" y="496" fill="#7d8590" font-size="9">Zeiss + Cymer lock-in</text>
  <text x="345" y="510" fill="#f0883e" font-size="9">returns: ~200 tokens</text>

  <!-- ═══ ARROWS: tasks down (gray solid) ═══ -->
  <line x1="350" y1="150" x2="135" y2="218" stroke="#666" stroke-width="1.2" marker-end="url(#ad)"/>
  <line x1="400" y1="150" x2="300" y2="218" stroke="#666" stroke-width="1.2" marker-end="url(#ad)"/>
  <line x1="450" y1="150" x2="465" y2="218" stroke="#666" stroke-width="1.2" marker-end="url(#ad)"/>
  <line x1="500" y1="150" x2="630" y2="218" stroke="#666" stroke-width="1.2" marker-end="url(#ad)"/>
  <line x1="545" y1="150" x2="795" y2="218" stroke="#666" stroke-width="1.2" marker-end="url(#ad)"/>

  <!-- Moat → workers -->
  <line x1="275" y1="325" x2="240" y2="438" stroke="#666" stroke-width="1" marker-end="url(#ad)"/>
  <line x1="325" y1="325" x2="400" y2="438" stroke="#666" stroke-width="1" marker-end="url(#ad)"/>

  <!-- ═══ ARROWS: compressed results up (blue dashed) ═══ -->
  <line x1="135" y1="220" x2="355" y2="152" stroke="#4a9eff" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#au)"/>
  <line x1="300" y1="220" x2="395" y2="152" stroke="#4a9eff" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#au)"/>
  <line x1="465" y1="220" x2="448" y2="152" stroke="#4a9eff" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#au)"/>
  <line x1="630" y1="220" x2="498" y2="152" stroke="#4a9eff" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#au)"/>
  <line x1="795" y1="220" x2="545" y2="152" stroke="#4a9eff" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#au)"/>

  <!-- Workers → Moat -->
  <line x1="240" y1="440" x2="280" y2="327" stroke="#4a9eff" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#au)"/>
  <line x1="400" y1="440" x2="320" y2="327" stroke="#4a9eff" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#au)"/>

  <!-- ═══ COMPARISON BOX ═══ -->
  <rect x="60" y="560" width="780" height="100" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <text x="450" y="585" text-anchor="middle" fill="#c9d1d9" font-size="13" font-weight="bold">Single context vs RLM</text>

  <!-- Single context bar -->
  <text x="80" y="610" fill="#7d8590" font-size="10">1 agent, long context:</text>
  <rect x="260" y="598" width="560" height="16" rx="3" fill="#21262d"/>
  <rect x="260" y="598" width="112" height="16" rx="3" fill="#3fb950"/>
  <rect x="372" y="598" width="250" height="16" fill="#f8514966"/>
  <rect x="622" y="598" width="198" height="16" rx="0 3 3 0" fill="#da363366"/>
  <text x="310" y="610" text-anchor="middle" fill="#0d1117" font-size="9" font-weight="bold">signal 20%</text>
  <text x="497" y="610" text-anchor="middle" fill="#f85149" font-size="9">stale outputs 45%</text>
  <text x="721" y="610" text-anchor="middle" fill="#da3633" font-size="9">dead ends 35%</text>

  <!-- RLM bar -->
  <text x="80" y="642" fill="#7d8590" font-size="10">RLM root context:</text>
  <rect x="260" y="630" width="560" height="16" rx="3" fill="#21262d"/>
  <rect x="260" y="630" width="130" height="16" rx="3" fill="#3fb950"/>
  <rect x="390" y="630" width="430" height="16" rx="0 3 3 0" fill="#0d1117" stroke="#21262d" stroke-width="0.5"/>
  <text x="325" y="642" text-anchor="middle" fill="#0d1117" font-size="9" font-weight="bold">signal ~3K tok</text>
  <text x="605" y="642" text-anchor="middle" fill="#484f58" font-size="9">unused — clean context for synthesis</text>
</svg>
